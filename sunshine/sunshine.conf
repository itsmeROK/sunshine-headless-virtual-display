# Reference example - install.sh constructs this for you with your own $HOME path.
# output_name must match the headless virtual monitor name (default HEADLESS-1).
output_name = HEADLESS-1

# Hooks: connect ("do") migrates workspaces to the headless and turns the
# physical monitor off; disconnect ("undo") restores everything.
global_prep_cmd = [{"do":"$HOME/.local/bin/sunshine-headless-connect.sh","undo":"$HOME/.local/bin/sunshine-headless-disconnect.sh","elevated":"false"}]
